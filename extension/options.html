<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Smart Find options</title>
<style>
  :root { --bg: #f5f5f7; --card: #fff; --fg: #1d1d1f; --muted: #6e6e73; --line: #d2d2d7; --accent: #0071e3; --ok: #1a7f37; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1c1c1e; --card: #2c2c2e; --fg: #f5f5f7; --muted: #a1a1a6; --line: #3a3a3c; --accent: #0a84ff; --ok: #30d158; color-scheme: dark; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 48px 16px; display: grid; gap: 20px; }
  h1 { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.01em; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; display: grid; gap: 12px; }
  label { font-weight: 600; }
  input { font: 14px ui-monospace, "SF Mono", Consolas, monospace; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); width: 100%; box-sizing: border-box; }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row { display: flex; gap: 12px; align-items: center; }
  button { font: 600 14px inherit; font-family: inherit; padding: 8px 16px; border-radius: 8px; border: 0; background: var(--accent); color: #fff; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  #status { color: var(--ok); font-size: 14px; }
  p { margin: 0; color: var(--muted); font-size: 14px; }
  kbd { font: 12px ui-monospace, Consolas, monospace; border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; color: var(--fg); }
</style>
</head>
<body>
<main>
  <h1>Smart Find</h1>
  <div class="card">
    <label for="key">TypeSafe API key</label>
    <input id="key" type="password" autocomplete="off" spellcheck="false" placeholder="apikey_…">
    <div class="row"><button id="save">Save key</button><span id="status" role="status"></span></div>
    <p>The key is stored only in this browser. Smart Find sends a page's text to TypeSafe's Jev API only when you run a search on that page.</p>
  </div>
  <div class="card">
    <p>Open Smart Find with <kbd>Ctrl</kbd> <kbd>Shift</kbd> <kbd>Space</kbd> or the toolbar button. To change the shortcut, go to <b>chrome://extensions/shortcuts</b>.</p>
  </div>
</main>
<script src="options.js"></script>
</body>
</html>
